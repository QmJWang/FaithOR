[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "faithor"
version = "0.1.0"
description = "FaithOR: component-level semantic diagnosis and one-round targeted repair for optimization modeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.50,<3"]

[project.optional-dependencies]
train = ["torch>=2.6", "transformers>=4.51", "peft>=0.15", "accelerate>=1.0"]
data = ["numpy>=1.24", "scipy>=1.11", "pyarrow>=15"]
solve = ["pyomo>=6.8", "highspy>=1.7"]
baselines = ["gurobipy>=11"]
test = ["pytest>=8", "ruff>=0.9", "numpy>=1.24", "scipy>=1.11", "pyarrow>=15"]

[project.scripts]
or-detect = "or_semantic_detector.inference:main"
or-repair = "or_semantic_detector.pipeline:main"
or-score = "or_semantic_detector.evaluation:main"
or-prepare-data = "or_semantic_detector.data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
